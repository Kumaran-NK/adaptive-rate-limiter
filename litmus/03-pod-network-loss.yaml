##############################################################################
# Test 3 — Pod Network Loss
# Blocks ALL network connectivity for an adaptive-rate-limiter pod for 60 s.
# Verifies: Application detects Redis/network failure and activates
#           the appropriate degradation mode (local fallback).
##############################################################################
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: rate-limiter-pod-network-loss
  namespace: rate-limiter
  labels:
    chaos-test: "03-pod-network-loss"
spec:
  engineState: active
  annotationCheck: "false"

  appinfo:
    appns: rate-limiter
    applabel: app=rate-limiter
    appkind: deployment

  chaosServiceAccount: litmus-chaos
  jobCleanUpPolicy: delete

  experiments:
    - name: pod-network-loss
      spec:
        components:
          env:
            # Required by chaoslib to find target pods in the correct namespace
            - name: APP_NAMESPACE
              value: "rate-limiter"
            - name: APP_LABEL
              value: "app=rate-limiter"
            # Total wall-clock duration of the chaos injection (seconds)
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            # Percentage of packets to drop (100 = total blackout)
            - name: NETWORK_INTERFACE
              value: "eth0"
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: "100"
            # Target the 'app' container specifically
            - name: TARGET_CONTAINER
              value: "app"
            # Percentage of matching pods to target
            - name: PODS_AFFECTED_PERC
              value: "50"
            # Inject chaos into pods one at a time
            - name: SEQUENCE
              value: "serial"
            # Container runtime (cluster uses containerd, not docker)
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"
            # Optional: restrict loss to traffic heading to Redis only
            # Uncomment to target Redis traffic specifically instead of all traffic
            # - name: DESTINATION_IPS
            #   value: ""  # Set to Redis ClusterIP if you want surgical targeting
            # - name: DESTINATION_HOSTS
            #   value: "redis-service.rate-limiter.svc.cluster.local"
