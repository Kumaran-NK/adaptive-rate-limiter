##############################################################################
# Test 6 — Pod Memory Hog
# Consumes excessive memory inside an adaptive-rate-limiter pod for 60 s.
# Verifies: Application behavior and recovery under memory pressure
#           (OOMKill thresholds, JVM heap behavior, pod restart).
##############################################################################
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: rate-limiter-pod-memory-hog
  namespace: rate-limiter
  labels:
    chaos-test: "06-pod-memory-hog"
spec:
  engineState: active
  annotationCheck: "false"

  appinfo:
    appns: rate-limiter
    applabel: app=rate-limiter
    appkind: deployment

  chaosServiceAccount: litmus-chaos
  jobCleanUpPolicy: delete

  experiments:
    - name: pod-memory-hog
      spec:
        components:
          env:
            # Required by chaoslib to find target pods in the correct namespace
            - name: APP_NAMESPACE
              value: "rate-limiter"
            - name: APP_LABEL
              value: "app=rate-limiter"
            # Total wall-clock duration of the chaos injection (seconds)
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            # Amount of memory to consume (in megabytes)
            # Pod limit is 512Mi — consuming 400Mi should create heavy pressure
            # without an instant OOMKill
            - name: MEMORY_CONSUMPTION
              value: "400"
            # Number of workers used to consume memory
            - name: NUMBER_OF_WORKERS
              value: "1"
            # Target the 'app' container specifically
            - name: TARGET_CONTAINER
              value: "app"
            # Percentage of matching pods to target
            - name: PODS_AFFECTED_PERC
              value: "50"
            # Inject chaos into pods one at a time
            - name: SEQUENCE
              value: "serial"
            # Container runtime (cluster uses containerd, not docker)
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"
