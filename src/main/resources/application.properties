spring.application.name=adaptive-rate-limiter
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Rate Limiter Defaults
rate-limiter.default-limit=100
rate-limiter.window-size-seconds=60
rate-limiter.redis-health-check-interval=3000
# rate-limiter.default-degradation-mode=FAIL_OPEN
rate-limiter.default-degradation-mode=FAIL_STRICT
rate-limiter.redis-health-check-initial-delay=5000

# Hysteresis - Different thresholds for entering vs leaving states
# was: enter-warning=50.0, exit-warning=100.0 (inverted — exit was looser than entry)
rate-limiter.hysteresis.enter-warning-latency-ms=50.0
rate-limiter.hysteresis.exit-warning-latency-ms=20.0
rate-limiter.hysteresis.enter-healthy-latency-ms=10.0
rate-limiter.hysteresis.warning-stabilization-seconds=15
rate-limiter.hysteresis.degraded-stabilization-seconds=30
rate-limiter.hysteresis.recovery-stabilization-seconds=30

# Alert Suppression
rate-limiter.alert.warning-alert-after-seconds=120
rate-limiter.alert.max-flaps-before-alert=5
rate-limiter.alert.flap-window-seconds=600

# Cache
rate-limiter.cache.local-ttl-seconds=10
rate-limiter.cache.max-size=10000

# Per-Endpoint Degradation Configuration
rate-limiter.endpoints.payment.degradation-mode=FAIL_CLOSED
rate-limiter.endpoints.payment.limit=10
rate-limiter.endpoints.sms.degradation-mode=FAIL_CLOSED
rate-limiter.endpoints.sms.limit=5
rate-limiter.endpoints.ai-inference.degradation-mode=FAIL_STRICT
rate-limiter.endpoints.ai-inference.limit=50
rate-limiter.endpoints.search.degradation-mode=FAIL_OPEN
rate-limiter.endpoints.search.limit=200

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.redis.sliding-window-size=10
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=30000ms
resilience4j.circuitbreaker.instances.redis.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redis.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.redis.automatic-transition-from-open-to-half-open-enabled=true

# Logging
logging.level.com.ratelimiter=DEBUG